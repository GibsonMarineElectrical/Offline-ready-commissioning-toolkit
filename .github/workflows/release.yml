name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  KEEP_LATEST_RELEASES: 5

permissions:
  contents: write

jobs:
  publish:
    name: Package and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="offline-ready-commissioning-toolkit_${RELEASE_TAG}.zip"

          zip -r "$ZIP" \
            docs \
            commissioning \
            software/GME-* \
            software/other-public-software \
            README.md \
            CHANGELOG.md \
            LICENSE \
            SECURITY.md \
            SUPPORT.md \
            THIRD_PARTY_NOTICES.md \
            .gitattributes \
            .gitignore

          sha256sum "$ZIP" > "${ZIP}.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            offline-ready-commissioning-toolkit_${{ env.RELEASE_TAG }}.zip
            offline-ready-commissioning-toolkit_${{ env.RELEASE_TAG }}.zip.sha256

      - name: Prune older releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP="${KEEP_LATEST_RELEASES}"

          echo "Keeping the latest ${KEEP} releases. Deleting older releases."

          ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate -q '.[].id')

          count=0
          for id in ${ids}; do
            count=$((count + 1))
            if [ "${count}" -le "${KEEP}" ]; then
              continue
            fi

            echo "Deleting release id=${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
