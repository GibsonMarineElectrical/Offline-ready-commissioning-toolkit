name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  publish:
    name: Package and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="offline-ready-commissioning-toolkit_${RELEASE_TAG}.zip"

          zip -r "$ZIP" \
            docs \
            commissioning \
            software/GME-* \
            README.md \
            CHANGELOG.md \
            LICENSE \
            SECURITY.md \
            SUPPORT.md \
            THIRD_PARTY_NOTICES.md \
            .gitattributes \
            .gitignore \
            -x "**/.gitkeep"

          sha256sum "$ZIP" > "${ZIP}.sha256"

      - name: Collect EXEs for release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find software -maxdepth 2 -type f -name "*.exe" -path "software/GME-*/*" -exec cp -v "{}" release-assets/ \;

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            offline-ready-commissioning-toolkit_${{ env.RELEASE_TAG }}.zip
            offline-ready-commissioning-toolkit_${{ env.RELEASE_TAG }}.zip.sha256
            release-assets/*.exe
