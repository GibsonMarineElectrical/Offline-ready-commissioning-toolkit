name: Reject Executables

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if EXEs are tracked
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files '*.exe' '*.EXE' || true)"

          if [ -n "${files}" ]; then
            echo "Tracked executables detected:"
            echo "${files}"
            echo ""
            echo "Remove these files from git and distribute them via GitHub Releases."
            exit 1
          fi
